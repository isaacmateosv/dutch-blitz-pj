name: BlitzRoom CI

# This tells GitHub to run this script every time you push to the main branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Spins up a secure Linux server

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip' # Speeds up future runs

    - name: 📦 Install Backend Dependencies
      run: |
        cd dutch-blitz-api
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🕵️‍♂️ Security & Syntax Check
      run: |
        cd dutch-blitz-api
        # This compiles the python files to check for fatal syntax errors 
        # without actually running the server.
        python -m py_compile main.py models.py database.py